name: CMake

on: [push, pull_request]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Download minimal cd image
      run: wget http://s2.jonnyh.net/pub/cd_minimal.iso.xz -O $GITHUB_WORKSPACE/data/cd.iso.xz
    
    - name: Extract minimal cd image
      run: xz -d $GITHUB_WORKSPACE/data/cd.iso.xz

    - name: Update apt-get repo
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install libsdl2-dev cmake build-essential git libunwind8-dev libboost-locale-dev libboost-filesystem-dev libboost-program-options-dev qt6-base-dev libvorbis-dev ninja-build

    - name: Install gcc-14
      run: sudo apt install gcc-14 g++-14

    - name: GCC 14 version check
      run: echo "GCC-14:"; which gcc-14;gcc-14 --version;

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: CC=gcc-14 CXX=g++-14 cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -GNinja -DUSE_PCH=ON

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE

    - name: Check source data tree stays clean
      shell: bash
      run: |
        dirty_generated_data="$(git status --short -- \
          data/animationpacks \
          data/bulletsprites \
          data/gamestate_common \
          data/imagepacks \
          data/maps \
          data/tilesets \
          data/mods/base/base_gamestate \
          data/mods/base/data/submods/org.openapoc.base/difficulty0 \
          data/mods/base/data/submods/org.openapoc.base/difficulty1 \
          data/mods/base/data/submods/org.openapoc.base/difficulty2 \
          data/mods/base/data/submods/org.openapoc.base/difficulty3 \
          data/mods/base/data/submods/org.openapoc.base/difficulty4 \
          data/mods/base/modinfo.xml \
          data/mods/crashing_vehicles/crashing_vehicles_gamestate)"
        if [ -n "$dirty_generated_data" ]; then
          echo "::error::Build wrote generated data into the source data tree."
          echo "$dirty_generated_data"
          exit 1
        fi

    - name: Test
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C $BUILD_TYPE
