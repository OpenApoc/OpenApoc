name: CMake

on: [push, pull_request]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # Pinned to the same commit as vcpkg.json's builtin-baseline.
  VCPKG_SHA: 30ef65cad98f08e7197c9a1656fbd871bcb72f2d
  # Sibling of the checkout so it never shows up in the repository's git status.
  VCPKG_ROOT: ${{ github.workspace }}/../vcpkg

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Download minimal cd image
      run: wget http://s2.jonnyh.net/pub/cd_minimal.iso.xz -O $GITHUB_WORKSPACE/data/cd.iso.xz
    
    - name: Extract minimal cd image
      run: xz -d $GITHUB_WORKSPACE/data/cd.iso.xz

    - name: Update apt-get repo
      run: sudo apt-get update

    # libsdl2-dev, libboost-locale-dev, libboost-filesystem-dev, libboost-program-options-dev and
    # libvorbis-dev are also provided by the vcpkg manifest; drop them here once a
    # vcpkg-toolchain CI run is green (qt6-base-dev stays, it backs USE_SYSTEM_QT/launcher).
    - name: Install dependencies
      run: sudo apt-get install libsdl2-dev cmake build-essential git libunwind8-dev libboost-locale-dev libboost-filesystem-dev libboost-program-options-dev qt6-base-dev libvorbis-dev ninja-build

    - name: Install gcc-14
      run: sudo apt install gcc-14 g++-14

    - name: GCC 14 version check
      run: echo "GCC-14:"; which gcc-14;gcc-14 --version;

    - name: Checkout vcpkg
      shell: bash
      run: |
        git clone --no-checkout https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
        git -C $VCPKG_ROOT checkout $VCPKG_SHA

    - name: Bootstrap vcpkg
      shell: bash
      run: $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

    - name: Cache vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-bincache-${{ runner.os }}-${{ env.VCPKG_SHA }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-bincache-${{ runner.os }}-${{ env.VCPKG_SHA }}-

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{runner.workspace}}/build
      # vcpkg's default binary cache on Linux is ~/.cache/vcpkg/archives, which is what the
      # cache step above restores and saves.
      # Note the current convention is to use the -S and -B options here to specify source
      # and build directories, but this is only available with CMake 3.13 and higher.
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: CC=gcc-14 CXX=g++-14 cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -GNinja -DUSE_PCH=ON -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C $BUILD_TYPE
